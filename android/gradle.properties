org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true
# 모든 의존성이 이미 AndroidX를 사용하므로 Jetifier 불필요 (비활성화 시 빌드 속도 30~50초 단축)
android.enableJetifier=false

# R8
# full mode: 더 공격적인 최적화(인터페이스 병합, 클래스 인라이닝, 미사용 인자 제거).
# 2025-03 릴리즈 빌드 실패로 껐으나 이후 proguard-rules.pro를 정리해 원인이 해소됨.
android.enableR8.fullMode=true
# 최적화된 리소스 축소: R8이 코드 축소 결과를 반영해 리소스를 함께 줄인다.
# AGP 9부터는 android.r8.optimizedResourceShrinking 으로 이름이 바뀐다.
android.r8.optimizedShrinking=true

# 빌드 최적화
android.nonTransitiveRClass=true
android.debug.obsoleteApi=true

# Gradle 성능 최적화
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.workers.max=4

# Kotlin/Gradle 빌드 가속 옵션
kotlin.incremental=true
kotlin.incremental.js=false
kotlin.compiler.execution.strategy=in-process
