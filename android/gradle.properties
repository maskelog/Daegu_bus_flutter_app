org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError

# AndroidX
android.useAndroidX=true
# 모든 의존성이 이미 AndroidX를 사용하므로 Jetifier 불필요 (비활성화 시 빌드 속도 30~50초 단축)
android.enableJetifier=false

# R8
# full mode: 더 공격적인 최적화(인터페이스 병합, 클래스 인라이닝, 미사용 인자 제거).
# 2025-03 릴리즈 빌드 실패로 껐으나 이후 proguard-rules.pro를 정리해 원인이 해소됨.
android.enableR8.fullMode=true
# 최적화된 리소스 축소: R8이 코드 축소 결과를 반영해 리소스를 함께 줄인다.
# AGP 9 기본값이지만 의도를 명시한다.
android.r8.optimizedResourceShrinking=true
# strict 모드에서는 `-keep class A`가 더 이상 기본 생성자를 함께 유지하지 않는다.
# 서드파티 consumer rules가 옛 의미를 전제하고 작성돼 있어 그대로 켜면 깨진다.
# 실제로 room-runtime 2.5.0의 `-keep class * extends androidx.room.RoomDatabase`
# (멤버 지정 없음) 때문에 WorkDatabase 생성자가 제거되어 앱이 시작 시 크래시했다.
# androidx.work.Worker / VersionedParcelable 규칙도 같은 형태다.
# 우리가 고칠 수 없는 규칙들이라 이 플래그만 AGP 8 동작으로 되돌린다.
# (full mode와 리소스 축소는 그대로 유지되므로 Play Console 항목에는 영향 없음)
android.r8.strictFullModeForKeepRules=false

# AGP 9 호환 opt-out
# Flutter 3.47.2의 flutter-gradle-plugin이 BaseExtension / applicationVariants 등
# legacy DSL·variant API를 사용한다(FlutterPluginUtils.kt getAndroidExtension).
# newDsl=true 상태에서는 findByType(BaseExtension)이 null이라 플러그인이 즉시 깨진다.
# built-in Kotlin도 kotlin-android 플러그인과 공존할 수 없어 함께 끈다.
# Flutter SDK와 모든 플러그인이 새 DSL/built-in Kotlin으로 이전하면 두 줄 모두 제거할 것.
# (AGP 10에서 opt-out 제거 예정)
android.newDsl=false
android.builtInKotlin=false

# 빌드 최적화
android.nonTransitiveRClass=true
android.debug.obsoleteApi=true

# Gradle 성능 최적화
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.workers.max=4

# Kotlin/Gradle 빌드 가속 옵션
kotlin.incremental=true
kotlin.incremental.js=false
kotlin.compiler.execution.strategy=in-process
